# The demo website: Helm chart in chart/ -> namespace demo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GreenPickle392/gitops-demo.git
    targetRevision: main
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true      # removed from Git = removed from the cluster
      selfHeal: true   # manual changes in the cluster are reverted
    syncOptions:
      - CreateNamespace=true
