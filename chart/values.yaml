# Inhalt und Look der Webseite
site:
  title: "Hallo udf-Team!"
  subtitle: "Diese Seite wurde gerade per Git-Commit ausgerollt."
  emoji: "🚀"
  accentColor: "#ef4444"   # Ideen: "#ef4444" rot, "#22c55e" grün, "#f59e0b" orange, "#06b6d4" türkis

# Anzahl der Pods (Demo: 1 -> 5 hochskalieren)
replicaCount: 3

# Version des Webservers (Demo: Update auf "1.29-alpine")
image:
  repository: nginx
  tag: "1.29-alpine"

# Adresse der Webseite (Traefik-Ingress)
host: demo.localhost
