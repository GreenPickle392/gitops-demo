server {
    listen 80;
    root /usr/share/nginx/html;

    # Server Side Includes: setzt Pod-Name und nginx-Version in die Seite ein
    ssi on;

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
