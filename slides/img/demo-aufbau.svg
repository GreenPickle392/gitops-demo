<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c4b5fd"/>
    </marker>
  </defs>

  <!-- kubernetes frame -->
  <rect x="260" y="2" width="856" height="452" rx="24" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.16)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="284" y="40" font-size="21" fill="#9aa0b4">Kubernetes – hier klein auf meinem Laptop</text>

  <g text-anchor="middle">
    <!-- outside -->
    <rect x="10" y="20" width="180" height="90" rx="16" fill="#141622" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="100" y="58" font-size="26" font-weight="700" fill="#fff">Du</text>
    <text x="100" y="88" font-size="18" fill="#9aa0b4">values.yaml ändern</text>

    <rect x="10" y="180" width="180" height="90" rx="16" fill="#141622" stroke="#8b5cf6" stroke-width="3"/>
    <text x="100" y="218" font-size="26" font-weight="700" fill="#fff">GitHub</text>
    <text x="100" y="248" font-size="18" fill="#c4b5fd">der Bauplan</text>

    <rect x="10" y="340" width="180" height="90" rx="16" fill="#141622" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="100" y="378" font-size="26" font-weight="700" fill="#fff">Browser</text>
    <text x="100" y="408" font-size="18" fill="#9aa0b4">demo.localhost</text>

    <!-- argo cd -->
    <rect x="340" y="150" width="280" height="150" rx="20" fill="rgba(139,92,246,.18)" stroke="#8b5cf6" stroke-width="3"/>
    <text x="480" y="215" font-size="32" font-weight="800" fill="#fff">Argo CD</text>
    <text x="480" y="252" font-size="21" fill="#c4b5fd">vergleicht &amp; baut</text>

    <!-- website -->
    <rect x="720" y="80" width="370" height="280" rx="20" fill="#141622" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="905" y="132" font-size="32" font-weight="800" fill="#fff">Webseite</text>
    <text x="905" y="168" font-size="21" fill="#9aa0b4">Container mit nginx-Webserver</text>
    <rect x="747" y="205" width="52" height="52" rx="10" fill="rgba(34,197,94,.18)" stroke="#22c55e" stroke-width="2"/>
    <rect x="813" y="205" width="52" height="52" rx="10" fill="rgba(139,92,246,.12)" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="879" y="205" width="52" height="52" rx="10" fill="rgba(139,92,246,.12)" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="945" y="205" width="52" height="52" rx="10" fill="rgba(139,92,246,.12)" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="1011" y="205" width="52" height="52" rx="10" fill="rgba(139,92,246,.12)" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="905" y="300" font-size="20" fill="#9aa0b4">erst 1 Kopie, am Ende 5</text>
  </g>

  <!-- arrows -->
  <g font-size="20" fill="#c4b5fd">
    <path d="M100 114 V172" stroke="#c4b5fd" stroke-width="4" marker-end="url(#a)"/>
    <text x="124" y="150">git push</text>

    <path d="M336 225 H198" stroke="#c4b5fd" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#a)"/>
    <text x="267" y="210" text-anchor="middle">schaut nach</text>

    <path d="M624 225 H712" stroke="#c4b5fd" stroke-width="4" marker-end="url(#a)"/>
    <text x="668" y="210" text-anchor="middle">baut</text>

    <path d="M194 395 H905 V368" stroke="#9aa0b4" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <text x="560" y="385" text-anchor="middle" fill="#9aa0b4">ruft die Seite auf</text>
  </g>
</svg>
