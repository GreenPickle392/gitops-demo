<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c4b5fd"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa0b4"/>
    </marker>
  </defs>

  <!-- cluster frame -->
  <rect x="250" y="2" width="866" height="530" rx="24" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.16)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="274" y="38" font-size="20" fill="#9aa0b4">Kubernetes-Cluster: k3s in Docker (k3d), lokal auf dem Laptop</text>

  <g text-anchor="middle">
    <!-- outside: laptop, GitHub, browser -->
    <rect x="10" y="20" width="200" height="86" rx="16" fill="#141622" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="110" y="57" font-size="24" font-weight="700" fill="#fff">Laptop</text>
    <text x="110" y="86" font-size="18" fill="#9aa0b4">values.yaml ändern</text>

    <rect x="10" y="190" width="200" height="86" rx="16" fill="#141622" stroke="#8b5cf6" stroke-width="3"/>
    <text x="110" y="227" font-size="24" font-weight="700" fill="#fff">GitHub</text>
    <text x="110" y="256" font-size="18" fill="#c4b5fd">Soll-Zustand</text>

    <rect x="10" y="420" width="200" height="70" rx="14" fill="#141622" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="110" y="450" font-size="22" font-weight="700" fill="#fff">Browser</text>
    <text x="110" y="475" font-size="16" fill="#9aa0b4">demo.localhost</text>

    <!-- inside: Argo CD -->
    <rect x="560" y="60" width="230" height="86" rx="16" fill="rgba(139,92,246,.2)" stroke="#8b5cf6" stroke-width="3"/>
    <text x="675" y="97" font-size="24" font-weight="700" fill="#fff">Argo CD</text>
    <text x="675" y="126" font-size="18" fill="#c4b5fd">vergleicht Soll / Ist</text>

    <!-- workload row -->
    <rect x="290" y="220" width="190" height="70" rx="14" fill="#141622" stroke="rgba(255,255,255,.2)"/>
    <text x="385" y="263" font-size="22" fill="#fff">Deployment</text>
    <rect x="540" y="220" width="190" height="70" rx="14" fill="#141622" stroke="rgba(255,255,255,.2)"/>
    <text x="635" y="263" font-size="22" fill="#fff">ReplicaSet</text>
    <rect x="800" y="280" width="290" height="110" rx="16" fill="rgba(34,197,94,.12)" stroke="#22c55e" stroke-width="2"/>
    <text x="945" y="325" font-size="24" font-weight="700" fill="#fff">Pods</text>
    <text x="945" y="359" font-size="18" fill="#9aa0b4">nginx + SSI (Pod-Name, Version)</text>
    <rect x="540" y="310" width="190" height="70" rx="14" fill="#141622" stroke="rgba(255,255,255,.2)"/>
    <text x="635" y="343" font-size="22" fill="#fff">ConfigMap</text>
    <text x="635" y="367" font-size="16" fill="#9aa0b4">index.html</text>

    <!-- network row -->
    <rect x="290" y="420" width="160" height="70" rx="14" fill="#141622" stroke="rgba(255,255,255,.2)"/>
    <text x="370" y="455" font-size="22" fill="#fff">Traefik</text>
    <text x="370" y="478" font-size="16" fill="#9aa0b4">Port 80</text>
    <rect x="500" y="420" width="140" height="70" rx="14" fill="#141622" stroke="rgba(255,255,255,.2)"/>
    <text x="570" y="463" font-size="22" fill="#fff">Ingress</text>
    <rect x="690" y="420" width="140" height="70" rx="14" fill="#141622" stroke="rgba(255,255,255,.2)"/>
    <text x="760" y="463" font-size="22" fill="#fff">Service</text>
  </g>

  <!-- arrows -->
  <path d="M110 110 V182" stroke="#c4b5fd" stroke-width="3" marker-end="url(#a)"/>
  <text x="122" y="152" font-size="17" fill="#c4b5fd">git push</text>
  <path d="M556 112 C430 112, 330 233, 218 233" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#a)"/>
  <text x="300" y="150" text-anchor="middle" font-size="17" fill="#c4b5fd">holt (Pull)</text>
  <path d="M630 150 C600 190, 430 180, 400 214" stroke="#c4b5fd" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="520" y="200" text-anchor="middle" font-size="17" fill="#c4b5fd">wendet an</text>
  <path d="M794 110 C870 130, 920 200, 935 274" stroke="#c4b5fd" stroke-width="3" stroke-dasharray="3 6" fill="none" marker-end="url(#a)"/>
  <text x="905" y="180" font-size="17" fill="#c4b5fd">Self-Heal</text>

  <path d="M484 255 H532" stroke="#9aa0b4" stroke-width="3" marker-end="url(#m)"/>
  <path d="M734 255 C770 255, 800 268, 820 276" stroke="#9aa0b4" stroke-width="3" fill="none" marker-end="url(#m)"/>
  <path d="M734 345 H792" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#m)"/>
  <path d="M214 455 H282" stroke="#9aa0b4" stroke-width="3" marker-end="url(#m)"/>
  <path d="M454 455 H492" stroke="#9aa0b4" stroke-width="3" marker-end="url(#m)"/>
  <path d="M644 455 H682" stroke="#9aa0b4" stroke-width="3" marker-end="url(#m)"/>
  <path d="M834 455 C880 455, 920 430, 935 398" stroke="#9aa0b4" stroke-width="3" fill="none" marker-end="url(#m)"/>
</svg>
