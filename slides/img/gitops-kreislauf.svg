<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c4b5fd"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- boxes -->
  <g text-anchor="middle">
    <rect x="10" y="70" width="210" height="150" rx="22" fill="#141622" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="115" y="135" font-size="34" font-weight="800" fill="#fff">Du</text>
    <text x="115" y="175" font-size="21" fill="#9aa0b4">änderst eine Datei</text>

    <rect x="300" y="70" width="230" height="150" rx="22" fill="#141622" stroke="#8b5cf6" stroke-width="3"/>
    <text x="415" y="135" font-size="34" font-weight="800" fill="#fff">Git-Repo</text>
    <text x="415" y="175" font-size="22" fill="#c4b5fd">Soll-Zustand</text>

    <rect x="610" y="70" width="230" height="150" rx="22" fill="rgba(139,92,246,.18)" stroke="#8b5cf6" stroke-width="3"/>
    <text x="725" y="135" font-size="34" font-weight="800" fill="#fff">Argo CD</text>
    <text x="725" y="175" font-size="22" fill="#c4b5fd">gleicht ab</text>

    <rect x="920" y="70" width="190" height="150" rx="22" fill="#141622" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="1015" y="135" font-size="34" font-weight="800" fill="#fff">Cluster</text>
    <text x="1015" y="175" font-size="22" fill="#9aa0b4">Ist-Zustand</text>
  </g>

  <!-- arrows -->
  <path d="M224 145 H292" stroke="#c4b5fd" stroke-width="4" marker-end="url(#a)"/>
  <text x="258" y="52" text-anchor="middle" font-size="20" fill="#c4b5fd">commit</text>
  <text x="258" y="76" text-anchor="middle" font-size="20" fill="#c4b5fd">+ push</text>

  <path d="M606 145 H538" stroke="#c4b5fd" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#a)"/>
  <text x="570" y="52" text-anchor="middle" font-size="20" fill="#c4b5fd">holt</text>
  <text x="570" y="76" text-anchor="middle" font-size="20" fill="#c4b5fd">(Pull)</text>

  <path d="M844 145 H912" stroke="#c4b5fd" stroke-width="4" marker-end="url(#a)"/>
  <text x="878" y="52" text-anchor="middle" font-size="20" fill="#c4b5fd">wendet</text>
  <text x="878" y="76" text-anchor="middle" font-size="20" fill="#c4b5fd">an</text>

  <!-- self-heal loop -->
  <path d="M1015 226 C1015 330, 735 330, 727 232" stroke="#22c55e" stroke-width="4" fill="none" marker-end="url(#g)"/>
  <text x="870" y="335" text-anchor="middle" font-size="22" font-weight="700" fill="#22c55e">Abweichung? → Self-Heal</text>

  <!-- rollback note -->
  <rect x="300" y="300" width="230" height="64" rx="32" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.18)"/>
  <text x="415" y="341" text-anchor="middle" font-size="23" fill="#fff">Rollback = <tspan font-family="Consolas, monospace" fill="#c4b5fd">git revert</tspan></text>
  <path d="M415 226 V292" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="4 5"/>

  <text x="560" y="420" text-anchor="middle" font-size="20" fill="#9aa0b4">Niemand greift direkt in den Cluster ein – auch keine Pipeline mit Admin-Rechten.</text>
</svg>
