<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c4b5fd"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- boxes -->
  <g text-anchor="middle">
    <rect x="10" y="70" width="180" height="150" rx="22" fill="#141622" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="100" y="135" font-size="34" font-weight="800" fill="#fff">Du</text>
    <text x="100" y="175" font-size="21" fill="#9aa0b4">änderst eine Datei</text>

    <rect x="270" y="70" width="230" height="150" rx="22" fill="#141622" stroke="#8b5cf6" stroke-width="3"/>
    <text x="385" y="135" font-size="34" font-weight="800" fill="#fff">GitHub</text>
    <text x="385" y="175" font-size="22" fill="#c4b5fd">der Bauplan</text>

    <rect x="580" y="70" width="230" height="150" rx="22" fill="rgba(139,92,246,.18)" stroke="#8b5cf6" stroke-width="3"/>
    <text x="695" y="135" font-size="34" font-weight="800" fill="#fff">Argo CD</text>
    <text x="695" y="175" font-size="22" fill="#c4b5fd">vergleicht</text>

    <rect x="890" y="70" width="220" height="150" rx="22" fill="#141622" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
    <text x="1000" y="135" font-size="31" font-weight="800" fill="#fff">Kubernetes</text>
    <text x="1000" y="175" font-size="22" fill="#9aa0b4">was wirklich läuft</text>
  </g>

  <!-- arrows -->
  <g text-anchor="middle" font-size="20" fill="#c4b5fd">
    <path d="M194 145 H262" stroke="#c4b5fd" stroke-width="4" marker-end="url(#a)"/>
    <text x="230" y="52">speichert</text>
    <text x="230" y="76">(push)</text>

    <path d="M576 145 H508" stroke="#c4b5fd" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#a)"/>
    <text x="540" y="52">schaut</text>
    <text x="540" y="76">nach</text>

    <path d="M814 145 H882" stroke="#c4b5fd" stroke-width="4" marker-end="url(#a)"/>
    <text x="850" y="52">baut</text>
    <text x="850" y="76">um</text>
  </g>

  <!-- repair loop -->
  <path d="M1000 226 C1000 320, 705 320, 697 232" stroke="#22c55e" stroke-width="4" fill="none" marker-end="url(#g)"/>
  <text x="850" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#22c55e">Jemand verstellt was von Hand?</text>
  <text x="850" y="368" text-anchor="middle" font-size="22" fill="#22c55e">Argo CD baut es zurück wie im Bauplan.</text>

  <!-- undo note -->
  <rect x="270" y="290" width="230" height="84" rx="20" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.18)"/>
  <text x="385" y="324" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Fehler gemacht?</text>
  <text x="385" y="354" text-anchor="middle" font-size="21" fill="#9aa0b4">alte Version zurück</text>
  <path d="M385 226 V284" stroke="#9aa0b4" stroke-width="2" stroke-dasharray="4 5"/>
</svg>
