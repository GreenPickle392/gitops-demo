# Diese App verbindet Argo CD mit dem GitHub-Repo.
# In Argo CD: "+ NEW APP" -> "EDIT AS YAML" -> diesen Text einfügen -> "SAVE" -> "CREATE".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GreenPickle392/gitops-demo.git   # <- hier steckt die Verbindung zu GitHub
    targetRevision: main                                          # Branch
    path: chart                                                   # Ordner mit der Webseite
  destination:
    server: https://kubernetes.default.svc                        # "dieser" Cluster
    namespace: demo                                               # hier landet die Webseite
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Kein "automated:" -> du klickst in der Demo selbst auf SYNC.
